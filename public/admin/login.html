<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <title>Connexion à la régie — TransAudio</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/brand.css?v=4">
  <link rel="stylesheet" href="/admin/login.css?v=4">
</head>
<body>
  <main class="connexion">
    <span class="marque">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="3.2" fill="currentColor"/>
        <g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
          <path d="M11.2 11.2a6.8 6.8 0 0 0 0 9.6M20.8 11.2a6.8 6.8 0 0 1 0 9.6"/>
          <path d="M7.3 7.3a12.3 12.3 0 0 0 0 17.4M24.7 7.3a12.3 12.3 0 0 1 0 17.4" opacity=".55"/>
        </g>
      </svg>
      TransAudio
    </span>

    <h1>Régie</h1>
    <p class="intro">Entrez le mot de passe de la régie pour lancer et suivre la traduction.</p>

    <form action="/admin/login" method="POST" class="formulaire">
      <p id="error-banner" class="erreur hidden" role="alert">Mot de passe incorrect. Vérifiez-le et réessayez.</p>

      <label for="password">Mot de passe</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required autofocus>

      <button type="submit">Se connecter</button>
    </form>

    <a class="retour" href="/">Aller à la page des fidèles</a>
  </main>

  <script>
    if (new URLSearchParams(location.search).get('error') === '1') {
      document.getElementById('error-banner').classList.remove('hidden');
      document.getElementById('password').setAttribute('aria-invalid', 'true');
    }
  </script>
</body>
</html>
